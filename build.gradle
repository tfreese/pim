// Execute Tasks in SubModule: gradle MODUL:clean build
plugins {
    id("de.freese.gradle.conventions").version("$version_myJavaConventionPlugin").apply(false)
    // id("io.spring.dependency-management").version("$version_springDependencyManagementPlugin").apply(false)
    id("org.openjfx.javafxplugin").version("$version_javafxPlugin").apply(false)
    id("org.springframework.boot").version("$version_springBoot").apply(false)
}

allprojects {
    plugins.apply("base")

    tasks.named("clean", Delete) {
        delete(layout.projectDirectory.dir("bin"))
        delete("logs")
        delete("out")
        delete("target")
    }
}

subprojects {
    plugins.apply("de.freese.gradle.conventions")
    plugins.apply("io.spring.dependency-management")

    dependencyManagement {
        imports {
            mavenBom("org.springframework.boot:spring-boot-dependencies:" + property("version_springBoot"))
        }

        dependencies {
            dependency("commons-cli:commons-cli:" + property("version_commonsCli"))
            dependency("org.jsoup:jsoup:" + property("version_jsoup"))
        }
    }

    pluginManager.withPlugin("java") {
        dependencies {
            runtimeOnly("org.springframework.boot:spring-boot-properties-migrator")

            testImplementation("org.awaitility:awaitility")
            testImplementation("org.junit.jupiter:junit-jupiter")

            testRuntimeOnly("org.junit.platform:junit-platform-launcher")
        }
    }
}
